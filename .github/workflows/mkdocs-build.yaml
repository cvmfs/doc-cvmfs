name: mkdocs-build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
      with:
        python-version: 3.9
    - name: Install Requirements
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    - name: MkDocs build
      run: |
        python -m mkdocs build --strict