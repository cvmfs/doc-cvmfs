# Read the Docs configuration for the repository-root MkDocs project.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.9"
    # You can also specify other tool versions:
    # nodejs: "16"
    # rust: "1.55"
    # golang: "1.17"

# Build documentation from the repository-root MkDocs configuration.
# Versioned publishing and the theme version switcher are managed with `mike`
# outside this RTD config (for example: `mike deploy latest`; local preview:
# `mike serve`).
mkdocs:
   configuration: mkdocs.yml

# Read the Docs only supports built-in pdf/epub/htmlzip output for Sphinx.
# Leave offline formats disabled until a separate MkDocs-compatible export
# pipeline is defined for this repository.

# Optionally declare the Python requirements required to build your docs
python:
   install:
   - requirements: requirements.txt
